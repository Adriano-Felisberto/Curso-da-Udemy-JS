<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <style>
        /* Estilo básico opcional para destacar os erros em vermelho */
        .error-text {
            color: #ff3333;
            font-size: 12px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <section class="container">

        <form class="addForm">

            <h1>Cadastro</h1>

            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" placeholder="Digite seu nome..." required>
            <small class="error-text"></small>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" placeholder="Digite seu sobrenome..." required>
            <small class="error-text"></small>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="Digite seu CPF...">
            <small class="error-text"></small>

            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário..." required>
            <small class="error-text"></small>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha..." required>
            <small class="error-text"></small>

            <label for="repetir-senha">Repetir senha:</label>
            <input type="password" id="repetir-senha" placeholder="Repita sua senha..." required>
            <small class="error-text"></small>

            <button class="enviar">Enviar</button>
        </form>

    </section>

    <script src="./assets/js/main.js"></script>

</body>

</html>
